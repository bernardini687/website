<nav class="left">
  <ul>
  {% for project in site.data.projects %}
    <li class="space-between">
      <a href="{{ project.link}}">{% if project.dead %}<s>{{ project.name }}</s>{% else %}{{ project.name }}{% endif %}</a>
      <span class="align-r dim-color">{{ project.blurb }}</span>
    </li>
  {% endfor %}
  </ul>
</nav>
